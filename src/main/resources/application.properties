# Security Configuration
app.security.allowed-origins=${CORS_ORIGINS:http://localhost:3000,http://localhost:8080}
app.security.auth-rate-limit=${AUTH_RATE_LIMIT:15}
app.security.api-rate-limit=${API_RATE_LIMIT:120}
app.security.max-body-size=${MAX_BODY_SIZE:1048576}
app.security.max-login-attempts=${MAX_LOGIN_ATTEMPTS:5}
app.security.lockout-duration-minutes=${LOCKOUT_DURATION_MINUTES:15}


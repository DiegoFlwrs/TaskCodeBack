# Production hardening profile
# Activar con: SPRING_PROFILES_ACTIVE=prod

spring.jpa.show-sql=false
logging.level.com.flores.taskcodeback=WARN
logging.level.org.springframework.security=WARN

app.security.swagger-enabled=false

springdoc.swagger-ui.enabled=false
springdoc.api-docs.enabled=false

# Redis cache (requiere instancia Redis accesible)
app.cache.redis.enabled=${CACHE_REDIS_ENABLED:true}
spring.autoconfigure.exclude=
spring.data.redis.host=${REDIS_HOST:localhost}
spring.data.redis.port=${REDIS_PORT:6379}
spring.data.redis.password=${REDIS_PASSWORD:}
spring.data.redis.timeout=3000ms
